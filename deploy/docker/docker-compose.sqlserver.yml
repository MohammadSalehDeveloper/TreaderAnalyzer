# Portable SQL Server for local development and as the database
# service in the full stack. Postgres is planned later; do not add it here yet.
#
# From the repo root:
#   docker compose -f deploy/docker/docker-compose.sqlserver.yml up -d
#
# Host connections (dotnet run, EF tools) use localhost,14333 (1433 is often taken locally).
# Other Compose services use host name "sqlserver" on container port 1433.

name: traderanalyzer-sqlserver

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: traderanalyzer-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-TraderAnalyzer_Dev!23}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -b -o /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

volumes:
  sqlserver-data:
