services:
  gateway:
    build:
      context: ../..
      dockerfile: src/API/API.Gateway/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - marketdata
      - trading
      - account
      - ai

  marketdata:
    build:
      context: ../..
      dockerfile: src/API/API.MarketData/Dockerfile
    ports:
      - "5001:8080"

  trading:
    build:
      context: ../..
      dockerfile: src/API/API.Trading/Dockerfile
    ports:
      - "5002:8080"

  account:
    build:
      context: ../..
      dockerfile: src/API/API.Account/Dockerfile
    ports:
      - "5003:8080"

  ai:
    build:
      context: ../..
      dockerfile: src/API/API.AI/Dockerfile
    ports:
      - "5004:8080"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "TraderAnalyzer_Dev!23"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
